[project]
name = "gym_management"
authors = [
    { name = "Shrouk Negeda", email = "sh.ta.3366@gmail.com.com"}
]
description = "Gym management (members, plans, classes, bookings, check-ins) on top of ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"
